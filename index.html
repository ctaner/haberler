<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haber Kanalları Canlı – 4'lü Ekran</title>
<meta name="description" content="NTV, Habertürk, Sözcü TV ve A Haber canlı yayınlarını tek sayfada 4'lü ekranda izleyin.">
<style>
  :root {
    --bg: #0b0d12;
    --bar: #151922;
    --text: #e8ebf2;
    --muted: #8b93a7;
    --accent: #e11d2e;
    --on: #22c55e;
    --gap: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--bar); border-bottom: 1px solid #232938;
  }
  header h1 { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); }

  button, .btn {
    background: #222836; color: var(--text); border: 1px solid #2f374a;
    padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  button:hover, .btn:hover { background: #2b3347; }
  button.active { border-color: var(--on); color: var(--on); }

  main {
    flex: 1; min-height: 0;
    display: grid; gap: var(--gap); padding: var(--gap);
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  }
  .tile { position: relative; background: #000; border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .tile .label {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    background: var(--bar); font-size: 12px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .tile .label .spacer { flex: 1; }
  .tile .label button, .tile .label a { padding: 3px 8px; font-size: 11px; }
  .frame { flex: 1; min-height: 0; position: relative; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Tek kanalı büyütme */
  main.focus { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  main.focus .tile:not(.focused) { display: none; }

  /* Dar ekran: alt alta 4 satır */
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; grid-template-rows: repeat(4, minmax(220px, 1fr)); overflow-y: auto; }
    html, body { height: auto; min-height: 100%; }
    main { min-height: 0; }
  }
</style>
</head>
<body>

<header>
  <h1><span>●</span> Haber Kanalları Canlı</h1>
  <span class="hint">Yayınlar sessiz başlar. Ses için kanalın "Sesi aç" düğmesine basın.</span>
  <div class="spacer"></div>
  <button id="muteAll">Hepsini sustur</button>
  <button id="reloadAll">Yenile</button>
  <button id="fsBtn">Tam ekran</button>
</header>

<main id="grid"></main>

<script>
  // YouTube kanal kimlikleri (UC...). Kanalın canlı yayını otomatik olarak gösterilir.
  const CHANNELS = [
    { name: "NTV",        id: "UC9TDTjbOjFB9jADmPhSAPsw", url: "https://www.youtube.com/@NTV" },
    { name: "Habertürk",  id: "UCn6dNfiRE_Xunu7iMyvD7AA", url: "https://www.youtube.com/@HabertürkTV" },
    { name: "Sözcü TV",   id: "UCOulx_rep5O4i9y6AyDqVvw", url: "https://www.youtube.com/@sozcutelevizyonu" },
    { name: "A Haber",    id: "UCKQhfw-lzz0uKnE1fY1PsAA", url: "https://www.youtube.com/@ahaber" }
  ];

  const grid = document.getElementById("grid");
  const tiles = [];

  function src(ch) {
    const p = new URLSearchParams({
      channel: ch.id, autoplay: 1, mute: 1, playsinline: 1,
      rel: 0, modestbranding: 1, enablejsapi: 1
    });
    return "https://www.youtube.com/embed/live_stream?" + p.toString();
  }

  function cmd(iframe, func) {
    iframe.contentWindow.postMessage(
      JSON.stringify({ event: "command", func, args: "" }), "*");
  }

  function setSound(activeIdx) {
    tiles.forEach((t, i) => {
      const on = i === activeIdx;
      cmd(t.iframe, on ? "unMute" : "mute");
      if (on) cmd(t.iframe, "playVideo");
      t.soundBtn.classList.toggle("active", on);
      t.soundBtn.textContent = on ? "🔊 Ses açık" : "🔇 Sesi aç";
    });
  }

  CHANNELS.forEach((ch, i) => {
    const tile = document.createElement("section");
    tile.className = "tile";
    tile.innerHTML = `
      <div class="label">
        <span class="dot"></span><span>${ch.name}</span>
        <span class="spacer"></span>
        <button class="sound">🔇 Sesi aç</button>
        <button class="zoom">Büyüt</button>
        <a class="btn" href="${ch.url}/live" target="_blank" rel="noopener">YouTube'da aç ↗</a>
      </div>
      <div class="frame"></div>`;
    const frame = tile.querySelector(".frame");
    const iframe = document.createElement("iframe");
    iframe.title = ch.name + " canlı yayın";
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.src = src(ch);
    frame.appendChild(iframe);

    const soundBtn = tile.querySelector(".sound");
    soundBtn.addEventListener("click", () => {
      const active = soundBtn.classList.contains("active");
      if (active) { cmd(iframe, "mute"); soundBtn.classList.remove("active"); soundBtn.textContent = "🔇 Sesi aç"; }
      else setSound(i);
    });

    tile.querySelector(".zoom").addEventListener("click", (e) => {
      const focused = grid.classList.toggle("focus");
      tile.classList.toggle("focused", focused);
      tiles.forEach(t => { if (t.tile !== tile) t.tile.classList.remove("focused"); });
      e.target.textContent = focused ? "Küçült" : "Büyüt";
    });

    grid.appendChild(tile);
    tiles.push({ tile, iframe, soundBtn, ch });
  });

  document.getElementById("muteAll").addEventListener("click", () => setSound(-1));
  document.getElementById("reloadAll").addEventListener("click", () => {
    tiles.forEach(t => {
      t.iframe.src = src(t.ch);
      t.soundBtn.classList.remove("active");
      t.soundBtn.textContent = "🔇 Sesi aç";
    });
  });
  document.getElementById("fsBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
</script>
</body>
</html>
